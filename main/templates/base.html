<!DOCTYPE html>
<!--
  base.html — Sovereign publication frame shell (Sprint 6M-B / 6N-D)
  Chemical-language control room. No external scripts. No tracking.
-->
<html lang="{{language}}" dir="{{text_direction}}">
<head>
  {{head}}
  {{hreflang}}
</head>
<body class="bisulfid-frame bs-control-room" data-route-id="{{route_id}}" data-route-status="{{route_status}}" data-publication-posture="{{publication_posture}}" data-design-system="bisulfid-frame">
  <div class="bs-control-room__shell">
    {{governance_banner}}

    <header class="site-header">
      {{nav}}
    </header>

    {{breadcrumbs}}

    <main id="main-content" role="main">
      {{content}}
    </main>

    <footer class="site-footer">
      {{footer}}
    </footer>
  </div>
</body>
</html>
