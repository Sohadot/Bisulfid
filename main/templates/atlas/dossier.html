<article class="atlas-page atlas-page--dossier" lang="{{language}}">
  <header class="atlas-page__header">
    <p class="atlas-page__role">{{atlas_role}}</p>
    <h1 class="atlas-page__title">{{page_h1}}</h1>
    <p class="atlas-page__summary">{{reference_summary}}</p>
    <p class="atlas-page__classification">{{atlas_classification}}</p>
  </header>
  <section class="atlas-page__body">
    {{page_body}}
  </section>
  <section class="atlas-audience-layers" aria-label="Context layers">
    {{audience_layers}}
  </section>
  <aside class="atlas-source-posture" aria-label="Source and claim posture">
    <h2>Source and claim posture</h2>
    <p>{{source_posture_text}}</p>
  </aside>
  <nav class="atlas-internal-links" aria-label="Related atlas pages">
    <h2>Related atlas pages</h2>
    {{internal_links}}
  </nav>
</article>
