<!DOCTYPE html>
<html lang="{{language}}" dir="{{text_direction}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{canonical_url}}">
  <link rel="stylesheet" href="/assets/bisulfid-design-system/bisulfid-frame.css">
</head>
<body class="bs-control-room bisulfid-atlas {{body_semantic_classes}}" data-atlas-release="true" data-atlas-lane="{{atlas_lane_slug}}">
  <div class="bs-control-room__shell">
    <header class="site-header atlas-header" role="banner">
      <nav aria-label="Atlas navigation">
        <ul class="site-nav-list">
          <li><a href="/" class="site-nav-brand">BISULFID</a></li>
          <li><a href="/atlas/">Atlas</a></li>
          <li><a href="/glossary/">Glossary</a></li>
          <li><a href="/reference/terminology-spine-map/">Terminology</a></li>
          <li><a href="/reference/multilingual-layer-map/">Languages</a></li>
          <li><a href="/sources/">Sources</a></li>
        </ul>
      </nav>
    </header>
    {{breadcrumbs}}
    <main id="main-content" role="main">
      {{content}}
    </main>
    <footer class="site-footer" role="contentinfo">
      <div class="site-footer__inner">
        {{atlas_footer_nav}}
        <p class="footer-identity">Bisulfid Sovereign Reference Atlas</p>
        <p class="footer-copyright">Source-Governed Reference Page · Not medical, safety, or investment advice.</p>
      </div>
    </footer>
  </div>
</body>
</html>
