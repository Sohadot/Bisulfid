  home.html — Gateway homepage frame (Sprint 6M-B)
  Sovereign sulfur intelligence gateway shell for the 14,000-page launch corpus.
  Route must remain planned until explicit publication sprint authorization.

<!-- SLOT: content body -->
<article class="home-frame" lang="{{language}}" dir="{{text_direction}}">
  <header class="home-frame__header">
    <h1 class="home-frame__title">{{page_h1}}</h1>
    <p class="home-frame__intro">{{gateway_intro}}</p>
    <p class="home-frame__corpus-note">
      Minimum launch corpus: 14,000 governed pages — gateway frame only, not a launch.
    </p>
  </header>

  <section class="home-frame__term-map" aria-label="Interactive term map slot">
    {{interactive_term_map}}
  </section>

  <section class="home-frame__language-entry" aria-label="Language entry points">
    {{language_entry_points}}
  </section>

  <section class="home-frame__claims" aria-label="Governed claim slot">
    <p class="home-frame__claim-boundary">
      Introductory claims require source verification. No claim approval implied.
      {{source_required_flag}}
    </p>
  </section>

  {{internal_links}}
</article>
