<!--
  partials/source_bar.html — Source attribution slot (Sprint 6M-B)
  Emitted only when verified sources exist. Never implies approval or source-lock.
-->
<aside class="source-bar" aria-label="Source status" data-source-required="{{source_required_flag}}">
  <h2 class="source-bar__heading">Source and governance status</h2>
  <p class="source-bar__posture">{{source_posture_message}}</p>
  {{source_list}}
  <p class="source-bar__required" data-visible="{{source_required_visible}}">
    [SOURCE REQUIRED] markers remain binding where content requires verification.
    This frame does not remove source requirements or approve claims.
  </p>
</aside>
