<!--
  partials/breadcrumbs.html — Route context trail (Sprint 6M-B)
  Built from governed route metadata at render time. No invented links.
-->
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {{breadcrumb_items}}
  </ol>
  <p class="breadcrumbs__context" data-route-context="{{route_id}}">
    Route ID: {{route_id}} · Path: {{route_path}} · Layer: {{route_layer}}
  </p>
</nav>
