<!--
  reference.html — Reference-layer publication frame (Sprint 6M-B / 6N-B)
  Reference term-card framing with language depth.
-->
<article class="reference-frame bs-term-card {{term_card_modifier}}" lang="{{language}}" dir="{{text_direction}}">
  <header class="reference-frame__header bs-term-card__header">
    <div class="bs-language-depth" aria-label="Language depth">
      <span class="bs-language-depth__layer bs-language-depth__layer--{{language}}">{{language_depth_label}}</span>
      <span class="bs-language-depth__depth-indicator">Reference layer · {{route_layer}}</span>
    </div>
    <h1 class="reference-frame__title bs-term-card__title">{{page_h1}}</h1>
    <p class="reference-frame__layer bs-term-card__route-type">Reference layer: {{route_layer}}</p>
  </header>

  <div class="reference-frame__body bs-term-card__body">
    {{reference_body}}
  </div>

  <div class="bs-term-card__source-bar">
    {{source_bar}}
  </div>
  {{safety_notice}}
  {{internal_links}}
</article>
