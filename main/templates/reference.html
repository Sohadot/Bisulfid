<!--
  reference.html — Reference-layer publication frame (Sprint 6M-B)
  For gateway and reference routes in the 14,000-page governed corpus.
  Does not imply source-lock or claim approval.
-->
<article class="reference-frame" lang="{{language}}" dir="{{text_direction}}">
  <header class="reference-frame__header">
    <h1 class="reference-frame__title">{{page_h1}}</h1>
    <p class="reference-frame__layer">Reference layer: {{route_layer}}</p>
  </header>

  <div class="reference-frame__body">
    {{reference_body}}
  </div>

  {{source_bar}}
  {{safety_notice}}
  {{internal_links}}
</article>
