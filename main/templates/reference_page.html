<!--
  reference_page.html — Registry bridge to hardened reference.html (Sprint 6M-C)
  routes.json references this legacy name; build.py resolves to reference.html frame.
  NOT A LAUNCH TEMPLATE. Do not render for public output until route status is published
  and all Quality Gate conditions pass.
  Bridge target: main/templates/reference.html
-->
<article class="reference-frame" lang="{{language}}" dir="{{text_direction}}">
  <header class="reference-frame__header">
    <h1 class="reference-frame__title">{{page_h1}}</h1>
    <p class="reference-frame__layer">Reference layer: {{route_layer}}</p>
  </header>

  <div class="reference-frame__body">
    {{reference_body}}
  </div>

  {{source_bar}}
  {{safety_notice}}
  {{internal_links}}
</article>
