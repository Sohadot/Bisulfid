<!--
  term.html — Terminology publication frame (Sprint 6M-B)
  For ontology-governed term routes across EN/DE/AR and future multilingual waves.
  Term claims require verified sources — never implied by this frame.
-->
<article class="term-frame" lang="{{language}}" dir="{{text_direction}}">
  <header class="term-frame__header">
    <h1 class="term-frame__title">{{page_h1}}</h1>
    <p class="term-frame__meta">
      Term route · {{route_id}} · Cohort-ready for 14,000-page corpus scale
    </p>
  </header>

  <section class="term-frame__definition" aria-label="Term definition slot">
    {{term_definition}}
  </section>

  <section class="term-frame__related" aria-label="Related terms slot">
    {{related_terms}}
  </section>

  <section class="term-frame__disambiguation" aria-label="Disambiguation slot">
    {{disambiguation_notice}}
  </section>

  {{source_bar}}
  {{internal_links}}
</article>
