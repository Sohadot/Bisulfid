  <text x="55" y="19" font-family="ui-monospace,monospace" font-size="12" fill="#f0d060" opacity="0.95">∅</text>
  <text x="72" y="20" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#c4ccd6">de</text>
