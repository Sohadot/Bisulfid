      <stop offset="0%" stop-color="#e0b020" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f0d060" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0b020" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="moly-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4ccd6"/>
