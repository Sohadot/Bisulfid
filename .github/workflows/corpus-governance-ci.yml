name: Corpus Governance CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-governance:
    name: Corpus governance validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Layer 1 — corpus validation runtime"
        run: python scripts/corpus_validation_runtime_l1.py

      - name: "Layer 1 — source and claim guardrail runtime"
        run: python scripts/source_claim_guardrail_runtime_l1.py

      - name: "Layer 2 — production validation runtime"
        run: python scripts/corpus_production_runtime_l2.py

      - name: "Layer 2 — production planner (dry-run report)"
        run: python scripts/corpus_production_planner_l2.py

      - name: "Gate 12 — distinctiveness & information gain tests"
        run: python scripts/validators/test_distinctiveness.py

      - name: "Gate 12 — publication-candidate distinctiveness gate (blocking)"
        run: python scripts/validators/validate_distinctiveness.py --gate

      - name: "Gate 12 — legacy migration + Gate 12-I tests"
        run: python scripts/validators/test_legacy_migration.py

      - name: "Gate 12 — sealed legacy hold integrity + shrink-only ratchet"
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python scripts/validators/validate_distinctiveness.py --check-hold --hold-ratchet-ref "origin/${{ github.base_ref }}"
          else
            python scripts/validators/validate_distinctiveness.py --check-hold
          fi

      - name: "Reference Production — rendered outputs match governed inputs"
        run: |
          python scripts/reference_production/render_ko_reference.py --check
          python scripts/reference_production/render_institutional_preview.py --check

      - name: "Publication authority — resolver, renderer, sitemap and surface proofs"
        run: python scripts/publication/test_publication_authority.py

      - name: "Release-01 — route realization, consolidation obligations, human release gates"
        run: |
          python scripts/governance_scaffolding/route_realization_tests.py
          python scripts/publication/build_consolidation_obligations.py --check
          python scripts/release/release_checks_tests.py

      - name: "Release-01 PR-B — /acquire/ correction wording and boundaries"
        run: python scripts/publication/test_acquire_page.py

      - name: "Recovery — legacy disposition registry invariants"
        run: python scripts/recovery/validate_legacy_disposition.py

      - name: "Layer 0 — route registry validation"
        run: |
          if [ -f scripts/validate_route_registry_l0.py ]; then
            python scripts/validate_route_registry_l0.py
          else
            echo "ERROR: expected scripts/validate_route_registry_l0.py is missing"
            exit 1
          fi

      - name: "Layer 0 — content drafts validation"
        run: |
          if [ -f scripts/validate_content_drafts_l0.py ]; then
            python scripts/validate_content_drafts_l0.py
          else
            echo "ERROR: expected scripts/validate_content_drafts_l0.py is missing"
            exit 1
          fi
