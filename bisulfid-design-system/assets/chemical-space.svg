<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Chemical space lattice" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060708"/>
      <stop offset="50%" stop-color="#0c0e11"/>
      <stop offset="100%" stop-color="#14181e"/>
    </linearGradient>
    <linearGradient id="lattice-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a017" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a96a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#space-bg)"/>
  <!-- Perspective lattice plane -->
  <g opacity="0.55" stroke="url(#lattice-line)" stroke-width="1" fill="none">
    <line x1="0" y1="180" x2="400" y2="120"/>
    <line x1="0" y1="200" x2="400" y2="140"/>
    <line x1="0" y1="220" x2="400" y2="160"/>
    <line x1="50" y1="240" x2="200" y2="80"/>
    <line x1="150" y1="240" x2="300" y2="80"/>
    <line x1="250" y1="240" x2="400" y2="80"/>
    <line x1="100" y1="240" x2="250" y2="60"/>
    <line x1="200" y1="240" x2="350" y2="60"/>
  </g>
  <!-- Term node anchors -->
  <circle cx="200" cy="100" r="12" fill="#d4a017" opacity="0.35"/>
  <circle cx="200" cy="100" r="6" fill="#e8c547"/>
  <circle cx="120" cy="140" r="5" fill="#8a96a8" opacity="0.7"/>
  <circle cx="280" cy="130" r="5" fill="#8a96a8" opacity="0.7"/>
  <circle cx="160" cy="170" r="4" fill="#8a96a8" opacity="0.5"/>
  <circle cx="240" cy="165" r="4" fill="#8a96a8" opacity="0.5"/>
  <!-- Missing-E boundary arc -->
  <path d="M 170 95 Q 200 75 230 95" fill="none" stroke="#d4a017" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
</svg>
